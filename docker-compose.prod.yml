# Production compose — compiled builds, non-root user, 2 uvicorn workers.
# Quick start: docker compose -f docker-compose.prod.yml up --build -d

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ragdemo
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      # Persist data between container restarts
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rag_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres/ragdemo
    ports:
      - "${BACKEND_PORT:-8002}:8002"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rag_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    environment:
      NGINX_BACKEND_URL: http://backend:8002
    ports:
      - "${FRONTEND_PROD_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - rag_network

volumes:
  postgres_data:

networks:
  rag_network:
    driver: bridge
